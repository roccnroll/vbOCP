# Caso "test1", variante mesh conforme uniforme (senza infittimento angoli)
# Usato per isolare l'effetto della mesh sul confronto POD col paper.
# Vedi handout.md §14 per il confronto tra le due mesh.

problem:
  domain: [[0, 2], [0, 1]]     # Omega = [0,2] x [0,1]
  alpha: 0.07

  # sottodomini (dipendono da mu_u per Gamma_C / Gamma_N)
  omega_obs:                    # regione di osservazione, fissa
    - [[1, 2], [0.8, 1.0]]
    - [[1, 2], [0.0, 0.2]]

parameters:
  mu1: {min: 6, max: 20}         # diffusione inversa
  mu2: {min: 0.5, max: 3}        # ampiezza desired state
  mu_u: {min: 0, max: 1}         # posizione bordo di controllo

boundary_markers:                 # da mesh_conforming / mesh_uniform_corner_refined_ctrl
  0:  {segment: "bordo interno sottodominio", type: none}
  1:  {segment: "bordo interno sottodominio", type: none}
  2:  {segment: "bordo interno sottodominio", type: none}
  3:  {segment: "bordo interno sottodominio", type: none}
  4:  {segment: "bordo interno sottodominio", type: none}
  5:  {segment: "bordo interno sottodominio", type: none}
  6:  {segment: "bordo interno sottodominio", type: none}
  7:  {segment: "[0,1]x{0} bottom-left",  type: strong, value: "y=1,p=0"}
  8:  {segment: "[1,2]x{0} bottom-right", type: weak,   note: "Neumann + C su Gamma_C"}
  9:  {segment: "{2}x[0,1] destra",       type: weak,   note: "Neumann omogeneo"}
  10: {segment: "[1,2]x{1} top-right",    type: weak,   note: "Neumann + C su Gamma_C"}
  11: {segment: "[0,1]x{1} top-left",     type: strong, value: "y=1,p=0"}
  12: {segment: "{0}x[0,1] sinistra",     type: strong, value: "y=1,p=0"}

mesh:
  standard: conforming   # vedi handout.md §14 - mesh base, senza infittimento angoli
  path: data/meshes/test1_conforming
  n_nodes: 5226
